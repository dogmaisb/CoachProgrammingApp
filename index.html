    <div class="section-title">Weekly Program <span class="badge-count">${totalEx} exercises</span></div>
    <div class="week-plan" id="weekPlan">
      ${prog.map((day, dayIdx) => renderDayCard(day, dayIdx)).join('')}
    </div>
    <div style="height:40px"></div>
  `;
}

function renderDayCard(day, dayIdx) {
  const order = getItemOrder(day);
  const hasItems = order.length > 0;
  const exCount = day.exercises.length + (day.circuits||[]).reduce((n,c)=>n+c.exercises.length,0);

  const itemsHtml = order.map(item => {
    if (item.kind === 'ex') {
      const ex = (day.exercises||[]).find(e => e.id === item.id);
      if (!ex) return '';
      return `
        <div class="ex-row" id="item-ex-${ex.id}"
          ondragover="dayDragOver(event,${dayIdx},'ex','${ex.id}')"
          ondrop="dayDrop(event,${dayIdx},'ex','${ex.id}')">
          <div class="drag-handle" draggable="true"
            ondragstart="dayDragStart(event,${dayIdx},'ex','${ex.id}')"
            ondragend="dayDragEnd()">⠿</div>
          <div class="ex-name-cell">
            <input placeholder="Exercise name" value="${escHtml(ex.name)}"
              oninput="acShow(this);updateExName(${dayIdx},'${ex.id}',this.value)"
              onkeydown="acKey(event,this)" onblur="setTimeout(acHide,160)" />
          </div>
          <div class="sets-cell">
            <input type="number" min="1" max="20" value="${ex.sets}"
              oninput="updateExSets(${dayIdx},'${ex.id}',this.value)" />
          </div>
          <div class="reps-cell">${prescCellHtml(ex, dayIdx, null)}</div>
          <button class="icon-btn danger" onclick="removeExercise(${dayIdx},'${ex.id}')" title="Remove">✕</button>
        </div>`;
    } else {
      const ct = (day.circuits||[]).find(c => c.id === item.id);
      if (!ct) return '';
      const isSuperset = ct.exercises.length === 2;
      const blockLabel = isSuperset ? 'Superset' : 'Circuit';
      const namePh = isSuperset ? 'Superset name (optional)' : 'Circuit name (optional)';
      return `
        <div class="circuit-block" id="item-ct-${ct.id}"
          ondragover="dayDragOver(event,${dayIdx},'ct','${ct.id}')"
          ondrop="dayDrop(event,${dayIdx},'ct','${ct.id}')">
          <div class="circuit-header">
            <div class="drag-handle" draggable="true" style="font-size:14px;margin-right:0"
              ondragstart="dayDragStart(event,${dayIdx},'ct','${ct.id}')"
              ondragend="dayDragEnd()">⠿</div>
            <span class="circuit-label">${blockLabel}</span>
            <input class="circuit-name-input" placeholder="${namePh}"
              value="${escHtml(ct.name)}"
              oninput="updateCircuitName(${dayIdx},'${ct.id}',this.value);ctAcShow(this)"
              onfocus="ctAcShow(this)"
              onblur="setTimeout(ctAcHide,180)" />
            <button class="save-ct-btn" onclick="saveCircuitTemplate(${dayIdx},'${ct.id}')" title="Save as template">💾</button>
            <button class="icon-btn danger" onclick="removeCircuit(${dayIdx},'${ct.id}')" title="Remove">✕</button>
          </div>
          <div class="circuit-ex-list">
          ${ct.exercises.map(ex => `
            <div class="ex-row">
              <div class="ex-name-cell">
                <input placeholder="Exercise name" value="${escHtml(ex.name)}"
                  oninput="acShow(this);updateCircuitExName(${dayIdx},'${ct.id}','${ex.id}',this.value)"
                  onkeydown="acKey(event,this)" onblur="setTimeout(acHide,160)" />
              </div>
              <div class="sets-cell">
                <input type="number" min="1" max="20" value="${ex.sets}"
                  oninput="updateCircuitExSets(${dayIdx},'${ct.id}','${ex.id}',this.value)" />
              </div>
              <div class="reps-cell">${prescCellHtml(ex, dayIdx, ct.id)}</div>
              <button class="icon-btn danger" onclick="removeCircuitExercise(${dayIdx},'${ct.id}','${ex.id}')" title="Remove">✕</button>
            </div>
          `).join('')}
          </div>
          <button class="add-ex-btn" style="margin-top:6px" onclick="addCircuitExercise(${dayIdx},'${ct.id}')">+ Add Exercise</button>
        </div>`;
    }
  }).join('');

  return `
    <div class="day-card">
      <div class="day-header">
        <span class="day-label">${DAY_NAMES[dayIdx]} <span style="font-size:10px;font-weight:400;color:#3a6a8a;margin-left:4px">${fmtDate(dayDate(dayIdx))}</span></span>
        <div class="workout-name">
          <input placeholder="Workout name (e.g. Push Day)" value="${escHtml(day.workoutName)}"
            oninput="updateWorkoutName(${dayIdx}, this.value)" />
        </div>
        <div class="day-actions">
          <button onclick="copyDay(${dayIdx})" title="Copy another day's workout here" style="background:none;border:1px solid #2d4a6a;color:#4a7a9a;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;margin-right:4px;transition:all .1s" onmouseover="this.style.borderColor='#4a9adc';this.style.color='#8bbdd8'" onmouseout="this.style.borderColor='#2d4a6a';this.style.color='#4a7a9a'">Copy Day</button>
          <span style="font-size:10px;color:#2d4a6a;margin-right:4px">${exCount} ex</span>
        </div>
      </div>
      <div class="day-body">
        ${!hasItems ? `<div class="rest-day-label">Rest day — add exercises below to program this day</div>` : ''}
        ${hasItems ? `
          <div style="display:flex;gap:8px;margin-bottom:4px;padding:0 0 2px">
            <div style="width:20px"></div>
            <div class="ex-name-cell"><div class="col-label">Exercise</div></div>
            <div class="sets-cell"><div class="col-label">Sets</div></div>
            <div class="reps-cell"><div class="col-label">Prescription</div></div>
            <div style="width:28px"></div>
          </div>
        ` : ''}
        ${itemsHtml}
        <div style="display:flex;gap:0;margin-top:2px">
          <button class="add-ex-btn" onclick="addExercise(${dayIdx})">+ Add Exercise</button>
          <button class="add-circuit-btn" onclick="addCircuit(${dayIdx})">+ Add Circuit</button>
          <button class="add-superset-btn" onclick="addSuperset(${dayIdx})">⇄ Superset</button>
        </div>
      </div>
    </div>
  `;
}

// ── Import ────────────────────────────────────────────────────────────────────

// Infer the year for a "Mon D" date string using the export timestamp as anchor.
// Programs span future weeks, so exported Jun 2026 → "Jun 22" = 2026 is right.
// But if exported Dec 2025 and date is "Jan 5", that's Jan 2026 (year+1).
function inferYear(monthIdx, day, exportedDate) {
  const base = exportedDate ? new Date(exportedDate) : new Date();
  const baseYear = base.getFullYear();
  const baseMonth = base.getMonth();
  // Candidate in same year as export
  const candidate = new Date(baseYear, monthIdx, day);
  // If the candidate is more than 4 months BEFORE the export date, it likely belongs
  // to the following year (e.g., exported Oct 2025 for a Jan 2026 program).
  const diffMs = candidate - base;
  const diffMonths = diffMs / (1000 * 60 * 60 * 24 * 30);
  if (diffMonths < -4) return baseYear + 1;
  return baseYear;
}

function doImportJSON(data, targetClientId) {
  // Resolve or create client
  let client;
  if (targetClientId) {
    // Force-import into a specific client (name will be updated to match JSON)
    client = state.clients.find(c => c.id === targetClientId);
  }
  if (!client) {
    // Try to find by name
    client = state.clients.find(c => c.name.toLowerCase() === (data.client || '').toLowerCase());
  }
  if (!client) {
    // Create new client
    const importedOn = data.exported ? new Date(data.exported).toLocaleDateString() : 'today';
    client = { id: uid(), name: data.client || 'Imported Client', notes: `Imported ${importedOn}`, weekPrograms: {} };
    state.clients.push(client);
  }
  if (!client.weekPrograms) client.weekPrograms = {};

  let imported = 0;
  data.workouts.forEach(w => {
    const parts = w.date ? w.date.match(/^(\w+)\s+(\d+)(?:\s+(\d{4}))?$/) : null;
    if (!parts) return;
    const monthIdx = MONTHS_SHORT.indexOf(parts[1]);
    if (monthIdx < 0) return;
    const day = parseInt(parts[2]);
    const year = parts[3] ? parseInt(parts[3]) : inferYear(monthIdx, day, data.exported);
    const d = new Date(year, monthIdx, day);
    const mon = getMondayOf(d);
    const wKey = weekKey(mon);
    if (!client.weekPrograms[wKey]) client.weekPrograms[wKey] = emptyWeek();
    const dayIdx = (d.getDay() + 6) % 7;
    const slot = client.weekPrograms[wKey][dayIdx];
    slot.workoutName = w.name;
    const resolveType = ex => ex.type || EXERCISE_TYPE_MAP[ex.name?.toLowerCase()] || 'strength';
    slot.exercises = (w.exercises || []).map(ex => ({ id: uid(), name: ex.name, sets: ex.sets, reps: ex.reps, type: resolveType(ex) }));
    slot.circuits  = (w.circuits  || []).map(ct => ({ id: uid(), name: ct.name, exercises: (ct.exercises||[]).map(ex => ({ id: uid(), name: ex.name, sets: ex.sets, reps: ex.reps, type: resolveType(ex) })) }));
    slot.itemOrder = null; // rebuilt fresh from imported array order
    imported++;
  });

  save(state);
  activeClientId = client.id;

  // Jump to the first programmed week
  const allKeys = Object.keys(client.weekPrograms)
    .filter(k => { const p = client.weekPrograms[k]; return p.some(d => d.exercises.length || (d.circuits||[]).length || d.workoutName); })
    .sort();
  if (allKeys.length) {
    const parts = allKeys[0].split(' ');
    programWeekStart = new Date(parseInt(parts[2]), MONTHS_SHORT.indexOf(parts[0]), parseInt(parts[1]));
  }
  renderSidebar();
  renderMain();

  const totalExImported = data.workouts.reduce((n, w) => n + (w.exercises||[]).length + (w.circuits||[]).reduce((m,c)=>m+c.exercises.length,0), 0);
  const weeksCount = allKeys.length;
  const skipped = data.workouts.length - imported;
  openModal(`
    <h3>✓ Program Imported</h3>
    <p style="font-size:12px;color:#8bbdd8;margin:8px 0 14px">Successfully loaded <strong style="color:#c8dff0">${escHtml(client.name)}</strong>'s program.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:${skipped?'12px':'18px'}">
      ${[[weeksCount,'Weeks'],[imported,'Workout days'],[totalExImported,'Exercises']].map(([v,l])=>`
        <div style="background:#0a1828;border:1px solid #1e3a55;border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:18px;font-weight:700;color:#5adb9a">${v}</div>
          <div style="font-size:9px;color:#3a5a7a;text-transform:uppercase;margin-top:2px">${l}</div>
        </div>`).join('')}
    </div>
    ${skipped ? `<p style="font-size:11px;color:#f0a040;margin-bottom:16px">⚠️ ${skipped} day${skipped!==1?'s were':' was'} skipped — unrecognized date format.</p>` : ''}
    <button class="btn btn-success" onclick="closeModal()" style="width:100%">View Program →</button>
  `);
}

let _pendingImportData = null;
function confirmMergeImport() {
  if (!_pendingImportData) return;
  const d = _pendingImportData; _pendingImportData = null;
  closeModal();
  doImportJSON(d, null);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      let data;
      try { data = JSON.parse(e.target.result); }
      catch { openModal(`<h3 style="color:#e05050">❌ Invalid JSON</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The file couldn't be parsed. Make sure it's a valid .json file.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`); return; }

      // Wrong file type
      if (data._wt_backup) {
        openModal(`<h3 style="color:#f0a040">⚠️ Wrong File</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">This is a <strong style="color:#c8dff0">Workout Tracker backup</strong>, not a program export.<br>To view client progress, use <strong style="color:#5adb9a">📊 Import Progress</strong> instead.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }
      if (!data._coach_export || !Array.isArray(data.workouts)) {
        openModal(`<h3 style="color:#e05050">❌ Not a Program Export</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">This file doesn't look like a Coach program export.<br><br>In this app, select a client and click <strong style="color:#5adb9a">⬇ Export Program</strong> to create the file, then import it here.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }
      if (!data.client || !data.client.trim()) {
        openModal(`<h3 style="color:#e05050">❌ Missing Client Name</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The file doesn't include a client name. It may be corrupted or from an older version.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }
      if (data.workouts.length === 0) {
        openModal(`<h3 style="color:#f0a040">⚠️ Empty Program</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The file is a valid Coach export for <strong style="color:#c8dff0">${escHtml(data.client)}</strong> but contains no workout days.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }

      // Pre-validate each workout row
      const warnings = [];
      let badDates = 0, emptyDays = 0, totalEx = 0, totalCircuits = 0;
      data.workouts.forEach((w, i) => {
        if (!w.date || !w.date.match(/^\w+\s+\d+/)) { badDates++; warnings.push(`Row ${i+1}: unrecognized date "${w.date}"`); }
        const exCount = (w.exercises||[]).length + (w.circuits||[]).reduce((n,c)=>n+c.exercises.length,0);
        if (exCount === 0) emptyDays++;
        totalEx += (w.exercises||[]).length;
        totalCircuits += (w.circuits||[]).length;
      });

      const nameInJson = escHtml(data.client);
      const workoutCount = data.workouts.length;
      const exportedStr = data.exported ? new Date(data.exported).toLocaleDateString() : 'unknown';
      const existing = state.clients.find(c => c.name.toLowerCase() === data.client.toLowerCase());
      const hasData = existing && hasWeekData(Object.values(existing.weekPrograms || {}).flat());

      const warningBlock = warnings.length
        ? `<div style="background:#1a1000;border:1px solid #5a3a00;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#f0a040;line-height:1.7">
            ⚠️ ${badDates} day${badDates!==1?'s':''} will be skipped (unrecognized date format)${emptyDays ? `, ${emptyDays} day${emptyDays!==1?'s have':' has'} no exercises` : ''}.
           </div>`
        : '';
      const statsBlock = `
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 14px">
          ${[[workoutCount,'Workout days'],[totalEx,'Exercises'],[totalCircuits,'Circuits']].map(([v,l])=>`
            <div style="background:#0a1828;border:1px solid #1e3a55;border-radius:8px;padding:8px;text-align:center">
              <div style="font-size:16px;font-weight:700;color:#5adb9a">${v}</div>
              <div style="font-size:9px;color:#3a5a7a;text-transform:uppercase;margin-top:2px">${l}</div>
            </div>`).join('')}
        </div>
        <p style="font-size:10px;color:#3a5a7a;margin-bottom:16px">Exported: ${exportedStr}</p>`;

      if (hasData) {
        _pendingImportData = data;
        openModal(`
          <h3>Import Program for ${nameInJson}</h3>
          <p style="font-size:12px;color:#8bbdd8;margin:10px 0 4px;line-height:1.6">
            This client already has a program. Importing will <strong style="color:#f0a040">merge by date</strong> — existing weeks not in this file are untouched.
          </p>
          ${statsBlock}${warningBlock}
          <div style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-success" onclick="confirmMergeImport()">Merge into ${nameInJson}</button>
            <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          </div>
        `);
      } else {
        if (badDates > 0 && badDates === workoutCount) {
          openModal(`<h3 style="color:#e05050">❌ No Valid Dates</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">Every workout day has an unrecognized date format. Nothing could be imported.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
          return;
        }
        doImportJSON(data, null);
      }
    } catch (err) {
      openModal(`<h3 style="color:#e05050">❌ Failed to Read File</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px">${escHtml(err.message)}</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Saved Circuit Templates ───────────────────────────────────────────────────
function saveCircuitTemplate(dayIdx, ctId) {
  const day = getOrCreateWeekProgram()[dayIdx];
  const ct = (day.circuits||[]).find(c => c.id === ctId);
  if (!ct) return;
  const name = ct.name.trim();
  if (!name) { showToast('Name the circuit first, then save it'); return; }
  if (!state.savedCircuits) state.savedCircuits = [];
  const existing = state.savedCircuits.find(sc => sc.name.toLowerCase() === name.toLowerCase());
  const template = {
    id: existing ? existing.id : uid(),
    name,
    exercises: ct.exercises.map(ex => ({ name: ex.name, sets: ex.sets, reps: ex.reps, type: ex.type || 'strength' }))
  };
  if (existing) { Object.assign(existing, template); showToast(`Updated "${name}"`); }
  else { state.savedCircuits.push(template); showToast(`Saved "${name}"`); }
  save(state);
}

let _ctAcActive = null;
function ctAcShow(input) {
  if (!state.savedCircuits || !state.savedCircuits.length) return;
  const val = input.value.trim().toLowerCase();
  const matches = val
    ? state.savedCircuits.filter(sc => sc.name.toLowerCase().includes(val))
    : [...state.savedCircuits];
  if (!matches.length) { ctAcHide(); return; }
  _ctAcActive = { input, matches };
  const dd = document.getElementById('ct-ac-dropdown');
  const rect = input.getBoundingClientRect();
  dd.style.cssText = `display:block;left:${rect.left}px;top:${rect.bottom+3}px;min-width:${Math.max(rect.width,200)}px`;
  dd.innerHTML = matches.map((sc, i) => `
    <div class="ct-ac-item" onmousedown="ctAcPick(${i})">
      <span class="ct-ac-name">${escHtml(sc.name)}</span>
      <span class="ct-ac-count">${sc.exercises.length} ex</span>
      <span class="ct-ac-del" onmousedown="ctAcDelete(${i},event)">✕</span>
    </div>
  `).join('');
}
function ctAcHide() {
  const dd = document.getElementById('ct-ac-dropdown');
  if (dd) dd.style.display = 'none';
  _ctAcActive = null;
}
function ctAcPick(i) {
  if (!_ctAcActive) return;
  const input = _ctAcActive.input;
  const sc = _ctAcActive.matches[i];
  ctAcHide();
  const ctBlock = input.closest('.circuit-block');
  if (!ctBlock) return;
  const ctId = ctBlock.id.replace('item-ct-', '');
  const m = (ctBlock.getAttribute('ondrop') || '').match(/dayDrop\(event,(\d+)/);
  const dayIdx = m ? parseInt(m[1]) : -1;
  if (dayIdx < 0) return;
  const day = getOrCreateWeekProgram()[dayIdx];
  const ct = (day.circuits||[]).find(c => c.id === ctId);
  if (!ct) return;
  ct.name = sc.name;
  ct.exercises = sc.exercises.map(ex => ({ id: uid(), name: ex.name, sets: ex.sets, reps: ex.reps || null, type: ex.type || 'strength' }));
  save(state); renderMain();
}
function ctAcDelete(i, event) {
  event.stopPropagation();
  if (!_ctAcActive) return;
  const sc = _ctAcActive.matches[i];
  state.savedCircuits = state.savedCircuits.filter(s => s.id !== sc.id);
  save(state); ctAcHide();
}
document.addEventListener('click', e => {
  const dd = document.getElementById('ct-ac-dropdown');
  if (dd && !dd.contains(e.target) && !e.target.closest('.circuit-name-input')) ctAcHide();
});

// ── Init ──────────────────────────────────────────────────────────────────────
document.body.insertAdjacentHTML('beforeend',
  '<div id="ac-dropdown"></div><div id="ct-ac-dropdown"></div>'
);
renderSidebar();
renderMain();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/CoachProgrammingApp/sw.js');
}
