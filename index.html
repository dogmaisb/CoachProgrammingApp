<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout Coach</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a1828" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coach" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0f1a;
    color: #c8dff0;
    display: flex;
    flex-direction: column;
  }

  /* ── Layout ── */
  .app { display: flex; flex: 1; height: 100%; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: #0d1e30;
    border-right: 1px solid #1e3a55;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 18px 14px 10px;
    border-bottom: 1px solid #1e3a55;
  }
  .sidebar-header h2 { font-size: 13px; color: #4a9adc; text-transform: uppercase; letter-spacing: .08em; }
  .sidebar-header p  { font-size: 11px; color: #3a6a8a; margin-top: 2px; }

  .client-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .client-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; font-size: 13px;
    border-left: 3px solid transparent;
    transition: all .12s;
  }
  .client-item:hover  { background: #1a2e45; }
  .client-item.active { background: #1a2e45; border-left-color: #4a9adc; color: #7dd8ff; }
  .client-item .del-btn {
    background: none; border: none; color: #3a5a7a; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px;
    opacity: 0; transition: opacity .1s;
  }
  .client-item:hover .del-btn { opacity: 1; }
  .client-item .del-btn:hover { color: #e05050; background: rgba(224,80,80,.12); }

  .add-client-btn {
    margin: 10px 10px 14px;
    padding: 9px; border-radius: 9px;
    background: #0d2a45; border: 1px dashed #2d5a7a;
    color: #4a9adc; font-size: 12px; font-weight: 600;
    cursor: pointer; width: calc(100% - 20px); text-align: center;
    transition: all .12s;
  }
  .add-client-btn:hover { background: #1a3d60; border-color: #4a9adc; }

  /* ── Main area ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    background: #0d1e30; border-bottom: 1px solid #1e3a55;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 18px; color: #f0f8ff; font-weight: 700; }
  .topbar .sub { font-size: 11px; color: #4a7a9a; margin-top: 2px; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 8px 16px; border-radius: 8px; border: none;
    font-size: 12px; font-weight: 700; cursor: pointer; transition: all .12s;
  }
  .btn-primary { background: #1a6aaa; color: #fff; }
  .btn-primary:hover { background: #2280cc; }
  .btn-success { background: #1a7a4a; color: #fff; }
  .btn-success:hover { background: #1d9e60; }
  .btn-danger  { background: #7a1a1a; color: #ffaaaa; }
  .btn-danger:hover  { background: #aa2222; }
  .btn-ghost  { background: none; border: 1px solid #2d4a6a; color: #8bbdd8; }
  .btn-ghost:hover  { background: #1a2e45; }

  .content { flex: 1; overflow-y: auto; padding: 20px; }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 12px; color: #2d4a6a;
  }
  .empty-state .icon { font-size: 48px; }
  .empty-state h3 { font-size: 16px; color: #3d6a8a; }
  .empty-state p  { font-size: 12px; text-align: center; max-width: 260px; line-height: 1.5; }

  /* ── Client info bar ── */
  .client-info-bar {
    background: #0d1e30; border: 1px solid #1e3a55; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .client-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #1a3d60, #0d2a45);
    border: 2px solid #2d5a8a;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #5adb9a; flex-shrink: 0;
  }
  .client-info-bar h2 { font-size: 16px; color: #f0f8ff; font-weight: 700; }
  .client-info-bar p  { font-size: 11px; color: #4a7a9a; margin-top: 2px; }
  .client-info-bar .spacer { flex: 1; }

  /* ── Week plan ── */
  .week-plan { display: flex; flex-direction: column; gap: 10px; }

  .day-card {
    background: #0d1e30; border: 1px solid #1e3a55; border-radius: 12px;
    overflow: hidden;
  }
  .day-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer;
    background: #0f2238;
    border-bottom: 1px solid #1e3a55;
    transition: background .12s;
  }
  .day-header:hover { background: #162d48; }
  .day-header .day-label { font-size: 12px; font-weight: 700; color: #5adb9a; min-width: 70px; }
  .day-header .workout-name { font-size: 13px; color: #c8dff0; flex: 1; margin: 0 10px; }
  .day-header .workout-name input {
    background: none; border: none; outline: none; color: #c8dff0;
    font-size: 13px; font-weight: 600; width: 100%;
    font-family: inherit;
  }
  .day-header .workout-name input::placeholder { color: #3a5a7a; }
  .day-header .day-actions { display: flex; gap: 6px; align-items: center; }
  .icon-btn {
    background: none; border: none; cursor: pointer; color: #4a7a9a;
    font-size: 14px; padding: 3px 6px; border-radius: 5px;
    transition: all .1s;
  }
  .icon-btn:hover { background: #1a2e45; color: #8bbdd8; }
  .icon-btn.danger:hover { color: #e05050; background: rgba(224,80,80,.12); }

  .day-body { padding: 10px 14px 12px; }

  /* ── Exercise rows ── */
  .ex-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid #0f2238;
  }
  .ex-row:last-child { border-bottom: none; }
  .ex-name-cell { flex: 1; }
  .ex-name-cell input, .ex-select {
    background: #0a1828; border: 1px solid #1e3a55; border-radius: 7px;
    color: #c8dff0; padding: 6px 9px; font-size: 12px; width: 100%;
    font-family: inherit; outline: none; transition: border-color .1s;
  }
  .ex-name-cell input:focus, .ex-select:focus { border-color: #4a9adc; }
  .sets-cell { width: 64px; flex-shrink: 0; }
  .reps-cell { width: 178px; flex-shrink: 0; }
  .sets-cell input {
    background: #0a1828; border: 1px solid #1e3a55; border-radius: 7px;
    color: #c8dff0; padding: 6px 6px; font-size: 12px; width: 100%;
    text-align: center; font-family: inherit; outline: none; transition: border-color .1s;
  }
  .sets-cell input:focus { border-color: #4a9adc; }
  /* Prescription cell (type selector + value input) */
  .presc-cell { display: flex; flex-direction: column; gap: 3px; }
  .presc-row  { display: flex; gap: 4px; align-items: center; }
  .presc-type-sel {
    width: 74px; flex-shrink: 0; font-size: 10px; font-weight: 700;
    background: #0a1828; border: 1px solid #1e4a6a; border-radius: 6px;
    color: #4a9adc; padding: 5px 4px; font-family: inherit; cursor: pointer;
  }
  .presc-val {
    flex: 1; min-width: 0;
    background: #0a1828; border: 1px solid #1e3a55; border-radius: 7px;
    color: #c8dff0; padding: 6px 6px; font-size: 12px;
    text-align: center; font-family: inherit; outline: none; transition: border-color .1s;
  }
  .presc-val:focus { border-color: #4a9adc; }
  .rm-suffix {
    font-size: 12px; font-weight: 800; color: #4a9adc;
    flex-shrink: 0; align-self: center; letter-spacing: .04em;
  }
  .col-label { font-size: 10px; color: #3a5a7a; text-align: center; margin-bottom: 3px; }

  .add-ex-btn {
    margin-top: 8px; padding: 7px 12px; border-radius: 7px;
    background: none; border: 1px dashed #2d4a6a; color: #4a7a9a;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all .12s;
  }
  .add-ex-btn:hover { background: #0f2238; border-color: #4a9adc; color: #4a9adc; }
  .add-circuit-btn {
    margin-top: 8px; margin-left: 6px; padding: 7px 12px; border-radius: 7px;
    background: none; border: 1px dashed #3a5a2a; color: #6a9a4a;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all .12s;
  }
  .add-circuit-btn:hover { background: #0f1f0a; border-color: #6a9a4a; color: #8aba6a; }

  .circuit-block {
    margin-top: 10px; border: 1px solid #2a4a1a; border-radius: 8px;
    background: #0a1410; padding: 8px 10px;
  }
  .circuit-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .circuit-label {
    font-size: 10px; font-weight: 700; color: #6a9a4a; text-transform: uppercase;
    letter-spacing: .06em; white-space: nowrap;
  }
  .circuit-name-input {
    background: transparent; border: none; border-bottom: 1px solid #2a4a1a;
    color: #a0c080; font-size: 11px; padding: 2px 4px; outline: none;
    font-family: inherit; flex: 1; min-width: 0;
  }
  .circuit-name-input:focus { border-bottom-color: #6a9a4a; }
  .circuit-name-input::placeholder { color: #3a5a2a; }

  .circuit-ex-list {
    position: relative;
    margin-left: 8px;
    padding-left: 14px;
  }
  .circuit-ex-list .ex-row { position: relative; }

  /* middle rows: full-height vertical line */
  .circuit-ex-list .ex-row::before {
    content: '';
    position: absolute;
    left: -14px;
    top: 0; bottom: 0;
    width: 0;
    border-left: 2px solid #3a6a1a;
  }
  /* middle rows: horizontal tick at midpoint */
  .circuit-ex-list .ex-row::after {
    content: '';
    position: absolute;
    left: -13px;
    top: calc(50% - 1px);
    width: 13px; height: 2px;
    background: #3a6a1a;
  }

  /* first row: L-shape, vertical arm goes down from midpoint */
  .circuit-ex-list .ex-row:first-child::before {
    top: 50%; bottom: 0;
    width: 12px;
    border-top: 2px solid #3a6a1a;
    border-top-left-radius: 6px;
  }
  .circuit-ex-list .ex-row:first-child::after { display: none; }

  /* last row: L-shape, vertical arm goes up to midpoint */
  .circuit-ex-list .ex-row:last-child::before {
    top: 0; bottom: 50%;
    width: 12px;
    border-bottom: 2px solid #3a6a1a;
    border-bottom-left-radius: 6px;
  }
  .circuit-ex-list .ex-row:last-child::after { display: none; }

  /* single row: just the top L (no downward arm) */
  .circuit-ex-list .ex-row:first-child:last-child::before {
    top: 50%; bottom: 50%;
    width: 12px;
    border-top: 2px solid #3a6a1a;
    border-bottom: none;
    border-top-left-radius: 6px;
    border-bottom-left-radius: 0;
  }

  .rest-day-label {
    font-size: 12px; color: #2d4a6a; padding: 8px 0; font-style: italic;
  }

  .drag-handle {
    cursor: grab; color: #2a4a6a; font-size: 15px; padding: 0 5px 0 0;
    flex-shrink: 0; user-select: none; display: flex; align-items: center;
    transition: color .1s; line-height: 1;
  }
  .drag-handle:hover { color: #4a9adc; }
  .drag-handle:active { cursor: grabbing; }
  .ex-row.drag-over { outline: 2px dashed #4a9adc; outline-offset: -1px; background: #0d1e34; }
  .circuit-block.drag-over { outline: 2px dashed #4a9adc; outline-offset: -2px; }
  .dragging-item { opacity: 0.35; }
  .add-superset-btn {
    margin-top: 8px; margin-left: 6px; padding: 7px 12px; border-radius: 7px;
    background: none; border: 1px dashed #2a4a8a; color: #4a7adc;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all .12s;
  }
  .add-superset-btn:hover { background: #0a1428; border-color: #4a7adc; color: #8aabf0; }

  /* ── Date picker strip ── */
  .date-strip {
    display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .date-chip {
    padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
    border: 1px solid #1e3a55; background: #0d1e30; color: #4a7a9a;
    cursor: pointer; transition: all .12s;
  }
  .date-chip:hover  { border-color: #4a9adc; color: #7dd8ff; }
  .date-chip.active { background: #1a3d60; border-color: #4a9adc; color: #7dd8ff; }

  /* ── Modal ── */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: #0d1e30; border: 1px solid #2d5a8a;
    border-radius: 14px; padding: 24px; width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h3 { font-size: 15px; color: #f0f8ff; margin-bottom: 16px; }
  .modal label { font-size: 11px; color: #4a7a9a; display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal textarea {
    width: 100%; background: #0a1828; border: 1px solid #1e3a55;
    border-radius: 8px; color: #c8dff0; padding: 9px 12px;
    font-size: 13px; font-family: inherit; outline: none;
    transition: border-color .1s;
  }
  .modal input:focus, .modal textarea:focus { border-color: #4a9adc; }
  .modal textarea { resize: vertical; min-height: 60px; }

  /* ── Calendar modal ── */
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav { background:none; border:1px solid #2d4a6a; color:#8bbdd8; border-radius:7px; padding:4px 10px; cursor:pointer; font-size:14px; }
  .cal-nav:hover { border-color:#4a9adc; color:#c8dff0; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-dow  { font-size:9px; font-weight:700; color:#3a5a7a; text-align:center; padding:2px 0 6px; text-transform:uppercase; }
  .cal-day  { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:7px; font-size:12px; cursor:pointer; color:#6a8aaa; position:relative; }
  .cal-day:hover { background:#1a3050; color:#c8dff0; }
  .cal-day.empty { cursor:default; }
  .cal-day.empty:hover { background:none; }
  .cal-day.has-workout { color:#c8dff0; font-weight:700; }
  .cal-day.has-workout::after { content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:#4a9adc; }
  .cal-day.in-week { background:#0f2238; color:#c8dff0; border-radius:0; }
  .cal-day.in-week:first-child, .cal-day.week-start { border-radius:7px 0 0 7px; }
  .cal-day.in-week:last-child,  .cal-day.week-end   { border-radius:0 7px 7px 0; }
  .cal-day.today { outline:1px solid #4a9adc; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }

  /* ── Export panel ── */
  .export-panel {
    background: #0d1e30; border: 1px solid #1a6a3a; border-radius: 12px;
    padding: 16px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .export-panel p { font-size: 12px; color: #4a9a6a; line-height: 1.5; }
  .export-panel strong { color: #5adb9a; }

  /* ── Import section ── */
  .import-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    background: none; border: 1px solid #2d4a6a;
    color: #8bbdd8; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all .12s;
  }
  .import-label:hover { background: #1a2e45; }

  /* ── View tabs ── */
  .view-tabs {
    display: inline-flex; gap: 3px; background: #0a1828;
    border-radius: 9px; padding: 3px; margin-bottom: 18px;
  }
  .view-tab {
    padding: 7px 18px; border-radius: 7px; border: none; cursor: pointer;
    font-size: 12px; font-weight: 700; transition: all .12s;
    background: none; color: #4a7a9a; font-family: inherit;
  }
  .view-tab.active { background: #1a3d60; color: #7dd8ff; }
  .view-tab:hover:not(.active) { color: #8bbdd8; }

  /* ── Progress view ── */
  .prog-chart-card {
    background: #0d1e30; border: 1px solid #1e3a55; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .prog-chart-title {
    font-size: 10px; font-weight: 700; color: #3a6a8a;
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px;
  }
  .prog-stat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .prog-stat-card {
    background: #0d1e30; border: 1px solid #1e3a55; border-radius: 10px;
    padding: 12px; text-align: center;
  }
  .prog-stat-val { font-size: 20px; font-weight: 700; }
  .prog-stat-label { font-size: 10px; color: #3a5a7a; margin-top: 3px; text-transform: uppercase; letter-spacing: .06em; }
  .prog-history-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .prog-history-table th { text-align: left; color: #3a5a7a; padding: 4px 8px; border-bottom: 1px solid #1a2e45; white-space: nowrap; }
  .prog-history-table th:not(:first-child) { text-align: center; }
  .prog-history-table td { padding: 5px 8px; border-bottom: 1px solid #0f1f30; }
  .prog-history-table td:not(:first-child) { text-align: center; }
  .prog-history-table tr:last-child td { border-bottom: none; }

  /* ── Autocomplete dropdown ── */
  #ac-dropdown, #ct-ac-dropdown {
    display: none; position: fixed; z-index: 500;
    border-radius: 9px; box-shadow: 0 10px 36px rgba(0,0,0,.6);
    overflow-y: auto; max-height: 260px;
  }
  #ac-dropdown {
    background: #0d1e30; border: 1px solid #2d5a8a;
  }
  #ct-ac-dropdown {
    background: #0a1a0e; border: 1px solid #2a5a20;
  }
  .ac-item {
    padding: 8px 13px; font-size: 12px; color: #c8dff0;
    cursor: pointer; border-bottom: 1px solid #0f2238;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item.ac-hover { background: #1a3050; color: #7dd8ff; }
  .ct-ac-item {
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid #1a3a10; padding: 7px 10px;
    cursor: pointer; color: #a0c080;
  }
  .ct-ac-item:last-child { border-bottom: none; }
  .ct-ac-item:hover { background: #112210; }
  .ct-ac-name { font-weight: 700; color: #8aba6a; font-size: 12px; flex: 1; }
  .ct-ac-count { color: #3a6a2a; font-size: 10px; white-space: nowrap; }
  .ct-ac-del { color: #2a4a20; font-size: 10px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
  .ct-ac-del:hover { color: #e05050; background: rgba(224,80,80,.12); }
  .save-ct-btn {
    flex-shrink: 0; background: none; border: 1px solid #2a4a1a; color: #4a7a2a;
    border-radius: 5px; padding: 2px 7px; font-size: 10px; font-weight: 700;
    cursor: pointer; transition: all .1s; white-space: nowrap;
  }
  .save-ct-btn:hover { background: #0f2810; border-color: #6a9a4a; color: #8aba6a; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a1520; }
  ::-webkit-scrollbar-thumb { background: #1e3a55; border-radius: 3px; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #1a4a2a; border: 1px solid #1d9e75; border-radius: 10px;
    padding: 12px 18px; color: #4adbaa; font-size: 13px; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    animation: fadeInUp .2s ease;
    z-index: 200;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform: translateY(10px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .section-title {
    font-size: 11px; font-weight: 700; color: #3a6a8a;
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px; margin-top: 4px;
  }

  .badge-count {
    font-size: 10px; background: #1a3d60; color: #4a9adc;

<div class="app" id="app">

    </div>

        <p>Add a client from the sidebar, then build and export their workout program.</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" style="display:none">
  <div class="modal" id="modalBox"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display:none"></div>

<script>
// ── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'wc_coach_data';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { clients: [] };
    if (!d.savedCircuits) d.savedCircuits = [];
    return d;
  }
  catch { return { clients: [], savedCircuits: [] }; }
}
function save(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let state = load();
let activeClientId = null;

// ── Program week ──────────────────────────────────────────────────────────────
function getMondayOf(d) {
  const date = new Date(d);
  const dow = date.getDay();
  date.setDate(date.getDate() - (dow === 0 ? 6 : dow - 1));
  date.setHours(0,0,0,0);
  return date;
}
let programWeekStart = getMondayOf(new Date());

function weekKey(d) {
  return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`;
}

function emptyWeek() {
  return DAY_NAMES.map(day => ({ day, workoutName: '', exercises: [], circuits: [] }));
}

function getWeekProgram(client, d) {
  const c = client || getClient(); if (!c) return emptyWeek();
  const key = weekKey(d || programWeekStart);
  if (!c.weekPrograms) {
    // migrate legacy c.program into the current week
    c.weekPrograms = {};
    if (c.program) c.weekPrograms[key] = c.program;
  }
  return c.weekPrograms[key] || null;
}

function getOrCreateWeekProgram() {
  const c = getClient(); if (!c) return emptyWeek();
  const key = weekKey(programWeekStart);
  if (!c.weekPrograms) {
    c.weekPrograms = {};
    if (c.program) c.weekPrograms[key] = c.program;
  }
  if (!c.weekPrograms[key]) {
    c.weekPrograms[key] = emptyWeek();
  }
  return c.weekPrograms[key];
}

function hasWeekData(program) {
  return program && program.some(d => d.exercises.length || (d.circuits||[]).length || d.workoutName);
}

function shiftWeek(delta) {
  const newStart = new Date(programWeekStart);
  newStart.setDate(programWeekStart.getDate() + delta * 7);
  programWeekStart = newStart;
  renderMain();
}

function openWeekBrowser() {
  const c = getClient(); if (!c) return;
  const curKey = weekKey(programWeekStart);
  const entries = Object.entries(c.weekPrograms || {})
    .filter(([, prog]) => hasWeekData(prog))
    .map(([key, prog]) => {
      const parts = key.split(' ');
      const mon = new Date(parseInt(parts[2]), MONTHS_SHORT.indexOf(parts[0]), parseInt(parts[1]));
      const dayCount = prog.filter(d => d.exercises.length || (d.circuits||[]).length || d.workoutName).length;
      return { key, mon, dayCount, isCurrent: key === curKey };
    })
    .sort((a, b) => a.mon - b.mon);

  if (!entries.length) {
    openModal(`
      <h3>All Weeks</h3>
      <p style="font-size:12px;color:#4a7a9a;margin:12px 0 18px">No weeks programmed yet. Add exercises to any day to create a week.</p>
      <button class="btn btn-ghost" onclick="closeModal()" style="width:100%">Close</button>
    `);
    return;
  }

  const rows = entries.map(w => `
    <div onclick="programWeekStart=new Date(${w.mon.getTime()});closeModal();renderMain()"
      style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid ${w.isCurrent ? '#4a9adc' : '#1e3a55'};background:${w.isCurrent ? '#0f2238' : 'transparent'};margin-bottom:6px;transition:background .1s"
      onmouseover="this.style.background='#1a3050'" onmouseout="this.style.background='${w.isCurrent ? '#0f2238' : 'transparent'}'">
      <div>
        <div style="font-size:13px;font-weight:700;color:${w.isCurrent ? '#7dd8ff' : '#c8dff0'}">
          Week of ${fmtDate(w.mon)}
          ${w.isCurrent ? '<span style="font-size:10px;color:#4a9adc;font-weight:400;margin-left:6px">← current</span>' : ''}
        </div>
        <div style="font-size:11px;color:#3a5a7a;margin-top:2px">${w.dayCount} day${w.dayCount !== 1 ? 's' : ''} programmed</div>
      </div>
      <span style="font-size:16px;color:#2d4a6a">›</span>
    </div>
  `).join('');

  openModal(`
    <h3>All Programmed Weeks <span style="font-size:11px;font-weight:400;color:#3a5a7a">${entries.length} week${entries.length!==1?'s':''}</span></h3>
    <p style="font-size:11px;color:#4a7a9a;margin-bottom:12px">Click any week to jump to it.</p>
    <div style="max-height:380px;overflow-y:auto">${rows}</div>
    <button class="btn btn-ghost" onclick="closeModal()" style="margin-top:10px;width:100%">Cancel</button>
  `);
}

function copyWeekForward() {
  const c = getClient(); if (!c) return;
  const src = getWeekProgram(c, programWeekStart);
  if (!hasWeekData(src)) { showToast('Nothing to copy — this week is empty.'); return; }
  const nextStart = new Date(programWeekStart);
  nextStart.setDate(programWeekStart.getDate() + 7);
  const nextKey = weekKey(nextStart);
  const nextLabel = 'Week of ' + fmtDate(nextStart);
  const nextProg = getWeekProgram(c, nextStart);

  function doCopy() {
    if (!c.weekPrograms) c.weekPrograms = {};
    c.weekPrograms[nextKey] = JSON.parse(JSON.stringify(src));
    save(state);
    programWeekStart = nextStart;
    renderMain();
    showToast(`✓ Copied to ${nextLabel}!`);
  }

  if (hasWeekData(nextProg)) {
    openModal(`
      <h3>Overwrite ${nextLabel}?</h3>
      <p style="font-size:12px;color:#8bbdd8;margin-bottom:18px;line-height:1.6">
        That week already has a program. Copying will replace all 7 days.
      </p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" onclick="closeModal();(${doCopy.toString()})()">Yes, overwrite</button>
      </div>
    `);
  } else {
    doCopy();
  }
}

let calViewYear  = new Date().getFullYear();
let calViewMonth = new Date().getMonth();

function openCalendar() {
  calViewYear  = programWeekStart.getFullYear();
  calViewMonth = programWeekStart.getMonth();
  renderCalendar();
}

function renderCalendar() {
  const c = getClient();
  // Build set of day-of-week indices (0=Mon…6=Sun) that have content
  // Build set of date strings that have workout content across all stored weeks
  const activeDates = new Set();
  if (c && c.weekPrograms) {
    Object.entries(c.weekPrograms).forEach(([key, prog]) => {
      const parts = key.split(' ');
      const mon = new Date(parseInt(parts[2]), MONTHS_SHORT.indexOf(parts[0]), parseInt(parts[1]));
      prog.forEach((day, i) => {
        if (day.exercises.length || (day.circuits||[]).length || day.workoutName) {
          const d = new Date(mon); d.setDate(mon.getDate() + i);
          activeDates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
        }
      });
    });
  }

  const today = new Date(); today.setHours(0,0,0,0);
  const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
  const daysInMonth  = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  // Week starts Monday: getDay() 0=Sun→6, 1=Mon→0
  const startOffset  = (firstOfMonth.getDay() + 6) % 7;
  const MONTH_NAMES  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW_LABELS   = ['Mo','Tu','We','Th','Fr','Sa','Su'];

  let cells = '';
  // Empty cells before month start
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const date    = new Date(calViewYear, calViewMonth, d);
    const dow     = (date.getDay() + 6) % 7; // 0=Mon
    const isToday = date.getTime() === today.getTime();
    // Is this date within the current programWeekStart week?
    const weekEnd = new Date(programWeekStart); weekEnd.setDate(programWeekStart.getDate() + 6);
    const inWeek  = date >= programWeekStart && date <= weekEnd;
    const isWkStart = date.getTime() === programWeekStart.getTime();
    const isWkEnd   = date.getTime() === weekEnd.getTime();
    const hasWorkout = activeDates.has(`${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`);

    cells += `<div class="cal-day${isToday?' today':''}${inWeek?' in-week':''}${isWkStart?' week-start':''}${isWkEnd?' week-end':''}${hasWorkout?' has-workout':''}"
      onclick="calPickDay(${calViewYear},${calViewMonth},${d})">${d}</div>`;
  }

  openModal(`
    <div class="cal-header">
      <button class="cal-nav" onclick="calShiftMonth(-1)">‹</button>
      <strong style="color:#c8dff0;font-size:14px">${MONTH_NAMES[calViewMonth]} ${calViewYear}</strong>
      <button class="cal-nav" onclick="calShiftMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${DOW_LABELS.map(l => `<div class="cal-dow">${l}</div>`).join('')}
      ${cells}
    </div>
    <div style="margin-top:12px;font-size:10px;color:#2d4a6a;text-align:center">Click any day to jump to that week</div>
  `);
}

function calShiftMonth(delta) {
  calViewMonth += delta;
  if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
  if (calViewMonth < 0)  { calViewMonth = 11; calViewYear--; }
  renderCalendar();
}

function calPickDay(y, m, d) {
  const clicked = new Date(y, m, d);
  programWeekStart = getMondayOf(clicked);
  closeModal();
  renderMain();
}

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d) { return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`; }
function dayDate(dayIdx) {
  const d = new Date(programWeekStart);
  d.setDate(programWeekStart.getDate() + dayIdx);
  return d;
}

// Fast name→type lookup for auto-detection when typing/selecting an exercise
const EXERCISE_TYPE_MAP = Object.fromEntries(
  ALL_EXERCISES.map(e => [e.name.toLowerCase(), e.type])
);

const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

// ── Helpers ───────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.display = 'none'; }, 2800);
}

function openModal(html, onOpen) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalBg').style.display = 'flex';
  if (onOpen) onOpen();
}
function closeModal() {
  document.getElementById('modalBg').style.display = 'none';
}
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBg')) closeModal();
});

// ── Client CRUD ───────────────────────────────────────────────────────────────
function openAddClient() {
  openModal(`
    <h3>New Client</h3>
    <label>Full Name</label>
    <input id="mName" placeholder="e.g. Alex Johnson" autofocus />
    <label>Notes (optional)</label>
    <textarea id="mNotes" placeholder="Goals, injuries, experience level..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewClient()">Add Client</button>
    </div>
  `);
  setTimeout(() => document.getElementById('mName')?.focus(), 50);
}

function saveNewClient() {
  const name  = document.getElementById('mName').value.trim();
  const notes = document.getElementById('mNotes').value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  const client = {
    id: uid(), name, notes,
    program: DAY_NAMES.map(day => ({ day, workoutName: '', exercises: [], circuits: [] })),
  };
  state.clients.push(client);
  save(state);
  closeModal();
  renderSidebar();
  selectClient(client.id);
  showToast(`✓ ${name} added!`);
}

function openEditClient(id) {
  const c = state.clients.find(c => c.id === id);
  if (!c) return;
  openModal(`
    <h3>Edit Client</h3>
    <label>Full Name</label>
    <input id="mName" value="${escHtml(c.name)}" />
    <label>Notes</label>
    <textarea id="mNotes">${escHtml(c.notes || '')}</textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="updateClient('${id}')">Save</button>
    </div>
  `);
  setTimeout(() => document.getElementById('mName')?.focus(), 50);
}

function updateClient(id) {
  const c = state.clients.find(c => c.id === id);
  if (!c) return;
  c.name  = document.getElementById('mName').value.trim() || c.name;
  c.notes = document.getElementById('mNotes').value.trim();
  save(state);
  closeModal();
  renderSidebar();
  renderMain();
  showToast('✓ Client updated!');
}

function deleteClient(id) {
  if (!confirm('Delete this client and all their workouts?')) return;
  state.clients = state.clients.filter(c => c.id !== id);
  save(state);
  if (activeClientId === id) { activeClientId = null; }
  renderSidebar();
  renderMain();
}

function selectClient(id) {
  activeClientId = id;
  renderSidebar();
  renderMain();
}

// ── Program editing ───────────────────────────────────────────────────────────
function getClient() {
  return state.clients.find(c => c.id === activeClientId) || null;
}

function addExercise(dayIdx) {
  const c = getClient(); if (!c) return;
  const day = getOrCreateWeekProgram()[dayIdx];
  const newEx = { id: uid(), name: '', sets: 3, reps: null, type: 'strength' };
  day.exercises.push(newEx);
  const ord = getItemOrder(day); ord.push({ kind: 'ex', id: newEx.id }); day.itemOrder = ord;
  save(state);
  renderMain();
}

function removeExercise(dayIdx, exId) {
  const c = getClient(); if (!c) return;
  const day = getOrCreateWeekProgram()[dayIdx];
  day.exercises = day.exercises.filter(e => e.id !== exId);
  if (day.itemOrder) day.itemOrder = day.itemOrder.filter(o => !(o.kind === 'ex' && o.id === exId));
  save(state);
  renderMain();
}

function updateExName(dayIdx, exId, val) {
  const c = getClient(); if (!c) return;
  const ex = getOrCreateWeekProgram()[dayIdx].exercises.find(e => e.id === exId);
  if (ex) ex.name = val;
  save(state);
}

function updateExSets(dayIdx, exId, val) {
  const c = getClient(); if (!c) return;
  const ex = getOrCreateWeekProgram()[dayIdx].exercises.find(e => e.id === exId);
  if (ex) ex.sets = parseInt(val) || 0;
  save(state);
}

function parseReps(val) {
  if (val === '' || val == null) return null;
  const m = String(val).trim().match(/^(\d+)\s*e$/i);
  if (m) return m[1] + 'e';
  const n = parseInt(val);
  return isNaN(n) ? null : String(n);
}

function formatRepsExport(reps) {
  if (reps == null) return null;
  const m = String(reps).match(/^(\d+)e$/i);
  return m ? parseInt(m[1]) + ' each' : parseInt(reps) || null;
}

function updateExReps(dayIdx, exId, val) {
  const c = getClient(); if (!c) return;
  const ex = getOrCreateWeekProgram()[dayIdx].exercises.find(e => e.id === exId);
  if (ex) ex.reps = parseReps(val);
  save(state);
}

function addCircuit(dayIdx) {
  const c = getClient(); if (!c) return;
  const day = getOrCreateWeekProgram()[dayIdx];
  if (!day.circuits) day.circuits = [];
  const newCt = { id: uid(), name: '', exercises: [{ id: uid(), name: '', sets: 3, reps: null, type: 'strength' }] };
  day.circuits.push(newCt);
  const ord = getItemOrder(day); ord.push({ kind: 'ct', id: newCt.id }); day.itemOrder = ord;
  save(state); renderMain();
}
function removeCircuit(dayIdx, ctId) {
  const c = getClient(); if (!c) return;
  const day = getOrCreateWeekProgram()[dayIdx];
  day.circuits = (day.circuits || []).filter(ct => ct.id !== ctId);

function addSuperset(dayIdx) {

}
function getItemOrder(day) {
  const exIds = new Set((day.exercises||[]).map(e => e.id));
  const ctIds = new Set((day.circuits||[]).map(c => c.id));
  let ord = (day.itemOrder || []).filter(o => o.kind === 'ex' ? exIds.has(o.id) : ctIds.has(o.id));
  (day.exercises||[]).forEach(e => { if (!ord.find(o => o.kind==='ex' && o.id===e.id)) ord.push({kind:'ex',id:e.id}); });
  (day.circuits||[]).forEach(c => { if (!ord.find(o => o.kind==='ct' && o.id===c.id)) ord.push({kind:'ct',id:c.id}); });
  return ord;
}

function dayDragStart(event, dayIdx, kind, id) {

function dayDrop(event, dayIdx, kind, id) {

function copyDay(targetDayIdx) {
  const c = getClient(); if (!c) return;
  if (!c.weekPrograms) return;

  // Collect all days with content across all weeks, newest first
  const sources = [];
  Object.entries(c.weekPrograms).forEach(([key, prog]) => {
    const parts = key.split(' ');
    const mon = new Date(parseInt(parts[2]), MONTHS_SHORT.indexOf(parts[0]), parseInt(parts[1]));
    prog.forEach((day, i) => {
      if (!day.exercises.length && !(day.circuits||[]).length && !day.workoutName) return;
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      // Skip the target day itself in the current week
      if (key === weekKey(programWeekStart) && i === targetDayIdx) return;
      const exCount = day.exercises.length + (day.circuits||[]).reduce((s, ct) => s + ct.exercises.length, 0);
      const firstEx = day.exercises[0]?.name || day.circuits?.[0]?.exercises?.[0]?.name || '';
      sources.push({ key, dayIdx: i, date: d, label: DAY_NAMES[i], workoutName: day.workoutName, exCount, firstEx });
    });
  });

  sources.sort((a, b) => a.dayIdx !== b.dayIdx ? a.dayIdx - b.dayIdx : b.date - a.date);

  if (!sources.length) {
    showToast('No other days with workouts to copy from.');
    return;
  }

  const rows = sources.map((s, si) => `
    <div onclick="doCopyDay('${s.key}',${s.dayIdx},${targetDayIdx})"
      style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid #1e3a55;margin-bottom:6px;transition:background .1s"
      onmouseover="this.style.background='#1a3050'" onmouseout="this.style.background=''">
      <div>
        <div style="font-size:13px;font-weight:700;color:#c8dff0">${s.label} · ${fmtDate(s.date)}</div>
        ${s.workoutName ? `<div style="font-size:11px;color:#4a9adc;margin-top:2px">${escHtml(s.workoutName)}</div>` : ''}
        ${s.firstEx ? `<div style="font-size:10px;color:#3a5a7a;margin-top:2px">${escHtml(s.firstEx)}${s.exCount > 1 ? `, +${s.exCount - 1} more` : ''}</div>` : ''}
      </div>
      <span style="font-size:11px;color:#3a5a7a">${s.exCount} ex</span>

function doCopyDay(srcKey, srcDayIdx, targetDayIdx) {
  const c = getClient(); if (!c) return;
  const src  = c.weekPrograms[srcKey]?.[srcDayIdx];
  if (!src) return;
  const dest = getOrCreateWeekProgram()[targetDayIdx];
  // Deep-clone with fresh IDs
  dest.workoutName = src.workoutName;
  dest.exercises   = src.exercises.map(ex => ({ ...ex, id: uid() }));
  dest.circuits    = (src.circuits||[]).map(ct => ({
    ...ct, id: uid(),
    exercises: ct.exercises.map(ex => ({ ...ex, id: uid() })),
  }));
  save(state);
  closeModal();
  renderMain();
  showToast(`✓ Copied to ${DAY_NAMES[targetDayIdx]}!`);
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportDayWorkout(day, date) {
  if (!day.exercises.length && !(day.circuits||[]).length && !day.workoutName) return null;
  const order = getItemOrder(day);
  const fmtEx = ex => ({ name: ex.name.trim(), sets: ex.sets, reps: formatRepsExport(ex.reps), type: ex.type === 'max' ? 'strength' : (ex.type || 'strength') });
  // Export exercises and circuits in their display order
  const exercises = order
    .filter(o => o.kind === 'ex')
    .map(o => (day.exercises||[]).find(e => e.id === o.id))
    .filter(ex => ex && ex.name.trim())
    .map(fmtEx);
  const circuits = order
    .filter(o => o.kind === 'ct')
    .map(o => (day.circuits||[]).find(c => c.id === o.id))
    .filter(Boolean)
    .map(ct => ({ name: ct.name || 'Circuit', exercises: ct.exercises.filter(ex => ex.name.trim()).map(fmtEx) }))
    .filter(ct => ct.exercises.length);
  // Build _order: interleaved sequence of {kind, idx} so the client can reconstruct display order
  const _order = [];
  let exIdx = 0, ctIdx = 0;
  for (const o of order) {
    if (o.kind === 'ex') {
      const ex = (day.exercises||[]).find(e => e.id === o.id);
      if (ex && ex.name.trim()) _order.push({ kind: 'ex', idx: exIdx++ });
    } else {
      const ct = (day.circuits||[]).find(c => c.id === o.id);
      if (ct && ct.exercises.filter(e => e.name.trim()).length) _order.push({ kind: 'ct', idx: ctIdx++ });
    }
  }
  return { date: fmtDate(date), name: day.workoutName || day.day, exercises, circuits, _order };
}

function exportClient() {
  const c = getClient(); if (!c) return;

  // Collect all workouts across every stored week, sorted by date
  const workouts = [];
  Object.entries(c.weekPrograms || {}).forEach(([key, prog]) => {
    const parts = key.split(' ');
    const mon = new Date(parseInt(parts[2]), MONTHS_SHORT.indexOf(parts[0]), parseInt(parts[1]));
    prog.forEach((day, i) => {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      const w = exportDayWorkout(day, d);
      if (w) workouts.push({ ...w, _ts: d.getTime() });
    });
  });
  workouts.sort((a, b) => a._ts - b._ts);
  workouts.forEach(w => delete w._ts);

  if (!workouts.length) { showToast('Nothing to export yet.'); return; }

  const payload = {
    _coach_export: true,
    client: c.name,
    exported: new Date().toISOString(),
    workouts,
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `${c.name.replace(/\s+/g,'-')}-program-full.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`✓ Exported ${workouts.length} workouts for ${c.name}!`);
}

function importTrackerData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      let backup;
      try { backup = JSON.parse(ev.target.result); }
      catch { openModal(`<h3 style="color:#e05050">❌ Invalid JSON</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The file couldn't be parsed. Make sure it's a valid .json file.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`); return; }

      // Wrong file type detection
      if (backup._coach_export) {
        openModal(`<h3 style="color:#f0a040">⚠️ Wrong File</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">This is a <strong style="color:#c8dff0">Program export</strong>, not a Tracker backup.<br>To restore a program, use <strong style="color:#5adb9a">📂 Import Program</strong> instead.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }
      if (!backup._wt_backup || !backup.data) {
        openModal(`<h3 style="color:#e05050">❌ Not a Tracker Backup</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">This doesn't look like a Workout Tracker backup file.<br><br>In the Tracker app go to <strong style="color:#c8dff0">Settings → Data Backup → Export Backup</strong> and import that file here.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }

      const sets = backup.data.wt_sets;
      if (!Array.isArray(sets)) {
        openModal(`<h3 style="color:#e05050">❌ No Set Data Found</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The backup file doesn't contain any workout sets (<code>wt_sets</code>). The client may not have logged any workouts yet.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }
      if (sets.length === 0) {
        openModal(`<h3 style="color:#f0a040">⚠️ Empty Backup</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The backup file was read successfully but contains 0 logged sets. The client hasn't recorded any workouts yet.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }

      // Validate set structure — check first few for expected fields
      const validSets = sets.filter(s => s && typeof s.ex === 'string' && s.date && s.vals);
      const badCount = sets.length - validSets.length;
      if (validSets.length === 0) {
        openModal(`<h3 style="color:#e05050">❌ Unrecognized Format</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px;line-height:1.6">The file contains ${sets.length} entries but none have the expected set structure. This may be a backup from an incompatible version.</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
        return;
      }

      const c = getClient(); if (!c) return;
      const exercises = new Set(validSets.map(s => s.ex));
      const dates = new Set(validSets.map(s => s.date));

      c.trackerData = { sets: validSets, importedAt: new Date().toISOString() };
      save(state);
      activeView = 'progress';
      renderMain();

      openModal(`
        <h3>✓ Progress Imported</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px">
          ${[
            [validSets.length.toLocaleString(), 'Sets loaded'],
            [exercises.size, 'Exercises'],
            [dates.size, 'Sessions'],
            [badCount ? `⚠️ ${badCount}` : '0', 'Skipped (bad data)'],
          ].map(([v,l]) => `<div style="background:#0a1828;border:1px solid #1e3a55;border-radius:8px;padding:10px;text-align:center"><div style="font-size:18px;font-weight:700;color:#5adb9a">${v}</div><div style="font-size:10px;color:#3a5a7a;margin-top:2px;text-transform:uppercase">${l}</div></div>`).join('')}
        </div>
        ${badCount ? `<p style="font-size:11px;color:#f0a040;margin-bottom:14px">⚠️ ${badCount} set${badCount!==1?'s were':' was'} skipped due to missing fields.</p>` : ''}
        <button class="btn btn-success" onclick="closeModal()" style="width:100%">View Progress →</button>
      `);
    } catch (err) {
      openModal(`<h3 style="color:#e05050">❌ Failed to Read File</h3><p style="font-size:12px;color:#8bbdd8;margin:12px 0 18px">${escHtml(err.message)}</p><button class="btn btn-ghost" onclick="closeModal()" style="width:100%">OK</button>`);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function parseTrackerDate(dateStr) {
  if (!dateStr) return null;
  const parts = String(dateStr).trim().split(' ');
  const m = MONTHS_SHORT.indexOf(parts[0]);
  if (m < 0) return null;
  const d = parseInt(parts[1]);
  const now = new Date();
  let y = parts[2] ? parseInt(parts[2]) : now.getFullYear();
  if (!parts[2]) {
    const candidate = new Date(y, m, d);
    if (candidate > now) y--;
  }
  return new Date(y, m, d);
}

function groupSetsByDate(sets, exName) {
  const byDate = {};
  sets.filter(s => s.ex === exName).forEach(s => {
    const d = parseTrackerDate(s.date);
    if (!d) return;
    if (!byDate[s.date]) byDate[s.date] = { date: d, dateStr: s.date, sets: [] };
    byDate[s.date].sets.push(s);
  });
  return Object.values(byDate).sort((a, b) => a.date - b.date);
}

function makeSvgLineChart(points, { color = '#4a9adc', W = 520, H = 150 } = {}) {
  if (!points.length) return '<div style="color:#2d4a6a;font-size:12px;text-align:center;padding:40px 0">No data yet</div>';
  const gid = 'lg' + (++_chartGradId);
  const ml = 46, mr = 14, mt = 14, mb = 32;
  const cw = W - ml - mr, ch = H - mt - mb;
  const vals = points.map(p => p.y);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const n = points.length;
  const px = i => ml + (n > 1 ? i / (n - 1) : 0.5) * cw;
  const py = v => mt + (1 - (v - min) / range) * ch;

  // Grid + Y labels (5 levels)
  let grid = '';
  for (let t = 0; t <= 4; t++) {
    const yv = min + (t / 4) * range;
    const ys = py(yv);
    grid += `<line x1="${ml}" y1="${ys}" x2="${ml+cw}" y2="${ys}" stroke="#1a2e45" stroke-width="1"/>
      <text x="${ml-5}" y="${ys+4}" fill="#3a5a7a" font-size="9" text-anchor="end">${Math.round(yv)}</text>`;
  }

  // Area path
  let area = `M ${px(0)} ${mt+ch}`;
  points.forEach((p, i) => { area += ` L ${px(i)} ${py(p.y)}`; });
  area += ` L ${px(n-1)} ${mt+ch} Z`;

  // Line path
  let line = `M ${px(0)} ${py(points[0].y)}`;
  points.forEach((p, i) => { if (i) line += ` L ${px(i)} ${py(p.y)}`; });

  // X labels: up to 7
  const step = Math.max(1, Math.ceil(n / 7));
  const xLabels = points.map((p, i) =>
    (i % step === 0 || i === n - 1)
      ? `<text x="${px(i)}" y="${H-4}" fill="#3a5a7a" font-size="9" text-anchor="middle">${p.label}</text>`
      : ''
  ).join('');

  // Dots
  const dots = points.map((p, i) =>
    `<circle cx="${px(i)}" cy="${py(p.y)}" r="3.5" fill="${color}" stroke="#0d1e30" stroke-width="1.5"><title>${p.label}: ${p.y}</title></circle>`
  ).join('');

  // PR ring on max
  const maxIdx = vals.indexOf(Math.max(...vals));
  const prRing = `<circle cx="${px(maxIdx)}" cy="${py(vals[maxIdx])}" r="6" fill="none" stroke="#f0d040" stroke-width="2" opacity="0.85"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${H}px;display:block">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.03"/>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${prRing}${dots}${xLabels}
  </svg>`;
}

function makeSvgBarChart(bars, { color = '#5adb9a', W = 520, H = 100 } = {}) {
  if (!bars.length) return '';
  const ml = 46, mr = 14, mt = 10, mb = 28;
  const cw = W - ml - mr, ch = H - mt - mb;
  const maxVal = Math.max(...bars.map(b => b.y)) || 1;
  const gap = cw / bars.length;
  const bw = Math.max(4, Math.min(30, gap * 0.65));

  const rects = bars.map((b, i) => {
    const bh = (b.y / maxVal) * ch;
    const bx = ml + i * gap + (gap - bw) / 2;
    const by = mt + ch - bh;
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" opacity="0.65" rx="2"><title>${b.label}: ${b.y.toLocaleString()}</title></rect>`;
  }).join('');

  const step = Math.max(1, Math.ceil(bars.length / 7));
  const xLabels = bars.map((b, i) =>
    (i % step === 0 || i === bars.length - 1)
      ? `<text x="${(ml + i * gap + gap / 2).toFixed(1)}" y="${H-4}" fill="#3a5a7a" font-size="9" text-anchor="middle">${b.label}</text>`
      : ''
  ).join('');

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${H}px;display:block">
    <line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ch}" stroke="#1a2e45" stroke-width="1"/>
    <line x1="${ml}" y1="${mt+ch}" x2="${ml+cw}" y2="${mt+ch}" stroke="#1a2e45" stroke-width="1"/>
    <text x="${ml-5}" y="${mt+8}" fill="#3a5a7a" font-size="9" text-anchor="end">${Math.round(maxVal).toLocaleString()}</text>
    ${rects}${xLabels}
  </svg>`;
}

          : 'No tracker data imported yet.'}
      </div>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:700;color:#4a9adc;border:1px solid #2d4a6a;border-radius:7px;padding:5px 11px;white-space:nowrap;transition:all .12s" onmouseover="this.style.background='#1a2e45'" onmouseout="this.style.background=''">
        📂 ${importedAt ? 'Update Data' : 'Import Backup'}
        <input type="file" accept=".json" style="display:none" onchange="importTrackerData(event)"/>
      </label>
    </div>`;

  if (!sets.length) {
    return importBar + `
      <div class="empty-state" style="height:320px">
        <div class="icon">📈</div>
        <h3>No progress data yet</h3>
        <p>Import a backup from the client's Workout Tracker app (Settings → Data Backup → Export Backup) to see charts and history.</p>
      </div>`;
  }

  // ── Summary stats ──
  const uniqueDates = new Set(sets.map(s => s.date));
  const totalSessions = uniqueDates.size;
  let totalVolume = 0;
  sets.filter(s => s.type === 'strength').forEach(s => {
    const w = parseFloat(s.vals?.weight) || 0;
    const r = parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0;
    totalVolume += w * r;
  });
  const exCounts = {};
  sets.forEach(s => { exCounts[s.ex] = (exCounts[s.ex] || 0) + 1; });
  const topEx = Object.entries(exCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
  const exercises = [...new Set(sets.map(s => s.ex))].sort();

  if (!progressSelectedEx || !exercises.includes(progressSelectedEx)) {
    progressSelectedEx = exercises[0] || null;
  }

  const statsHtml = `
    <div class="prog-stat-grid">
      <div class="prog-stat-card"><div class="prog-stat-val" style="color:#4a9adc">${totalSessions}</div><div class="prog-stat-label">Sessions</div></div>
      <div class="prog-stat-card"><div class="prog-stat-val" style="color:#5adb9a">${totalVolume ? (totalVolume / 1000).toFixed(1) + 'k' : '—'}</div><div class="prog-stat-label">Total Volume (lb)</div></div>
      <div class="prog-stat-card"><div class="prog-stat-val" style="color:#f0a040;font-size:13px;padding-top:4px">${escHtml(topEx.length > 14 ? topEx.slice(0, 13) + '…' : topEx)}</div><div class="prog-stat-label">Most Trained</div></div>
    </div>`;

  // ── Exercise picker ──
  const exSets = sets.filter(s => s.ex === progressSelectedEx);
  const exType = exSets[0]?.type || 'strength';

  // PR badge
  let prBadge = '';
  if (exType === 'strength') {
    const weights = exSets.map(s => parseFloat(s.vals?.weight) || 0).filter(v => v > 0);
    if (weights.length) prBadge = `<span style="background:#1a2e10;border:1px solid #3a6a1a;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:#5adb9a;white-space:nowrap">🏆 ${Math.max(...weights)} lb PR</span>`;
  } else if (exType === 'bodyweight') {
    const reps = exSets.map(s => parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0).filter(v => v > 0);
    if (reps.length) prBadge = `<span style="background:#1a2e10;border:1px solid #3a6a1a;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:#5adb9a;white-space:nowrap">🏆 ${Math.max(...reps)} reps PR</span>`;
  }

  const pickerHtml = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="font-size:11px;font-weight:700;color:#3a6a8a;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Exercise</span>
      <select onchange="progressSelectedEx=this.value;renderMain()" style="flex:1;min-width:0;background:#0a1828;border:1px solid #1e3a55;border-radius:7px;color:#c8dff0;padding:7px 10px;font-size:12px;outline:none;font-family:inherit">
        ${exercises.map(ex => `<option value="${escHtml(ex)}"${ex === progressSelectedEx ? ' selected' : ''}>${escHtml(ex)}</option>`).join('')}
      </select>
      ${prBadge}
    </div>`;

  // ── Per-exercise charts ──
  const sessions = groupSetsByDate(sets, progressSelectedEx);
  let chartsHtml = '';

  if (!sessions.length) {
    chartsHtml = '<div style="color:#2d4a6a;font-size:12px;text-align:center;padding:32px 0">No sessions logged for this exercise yet.</div>';
  } else {
    // Build data series
    const weightPts = [], volPts = [], repsPts = [];
    sessions.forEach(sess => {
      const lbl = sess.dateStr;
      if (exType === 'strength') {
        const ws = sess.sets.map(s => parseFloat(s.vals?.weight) || 0).filter(v => v > 0);
        const rs = sess.sets.map(s => parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0).filter(v => v > 0);
        let vol = 0;
        sess.sets.forEach(s => {
          const w = parseFloat(s.vals?.weight) || 0;
          const r = parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0;
          vol += w * r;
        });
        if (ws.length) weightPts.push({ y: Math.max(...ws), label: lbl });
        if (vol) volPts.push({ y: vol, label: lbl });
        if (rs.length) repsPts.push({ y: Math.max(...rs), label: lbl });
      } else if (exType === 'cardio') {
        const ds = sess.sets.map(s => parseFloat(s.vals?.dist) || 0).filter(v => v > 0);
        if (ds.length) weightPts.push({ y: ds.reduce((a, b) => a + b, 0), label: lbl });
      } else if (exType === 'sprint') {
        const ts = sess.sets.map(s => parseFloat(s.vals?.stime) || 0).filter(v => v > 0);
        if (ts.length) weightPts.push({ y: Math.min(...ts), label: lbl }); // lower = better
      } else {
        const rs = sess.sets.map(s => parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0).filter(v => v > 0);
        if (rs.length) weightPts.push({ y: Math.max(...rs), label: lbl });
      }
    });

    const mainLabel = exType === 'strength' ? 'Max Weight per Session (lb)' : exType === 'sprint' ? 'Best Time per Session (s)' : exType === 'cardio' ? 'Total Distance per Session (mi)' : 'Max Reps per Session';
    const mainColor = exType === 'strength' ? '#4a9adc' : exType === 'sprint' ? '#e07050' : '#5adb9a';

    chartsHtml = `
      <div class="prog-chart-card">
        <div class="prog-chart-title">${mainLabel} <span style="color:#f0d040;font-size:9px">● = PR</span></div>
        ${makeSvgLineChart(weightPts, { color: mainColor })}
      </div>`;

    if (exType === 'strength' && volPts.length) {
      chartsHtml += `
        <div class="prog-chart-card">
          <div class="prog-chart-title">Session Volume (lb · reps)</div>
          ${makeSvgBarChart(volPts, { color: '#5adb9a' })}
        </div>`;
    }
    if (exType === 'strength' && repsPts.length) {
      chartsHtml += `
        <div class="prog-chart-card">
          <div class="prog-chart-title">Max Reps per Session</div>
          ${makeSvgLineChart(repsPts, { color: '#a07af0', H: 110 })}
        </div>`;
    }

    // History table
    const recent = [...sessions].reverse().slice(0, 20);
    const theadCols = exType === 'strength'
      ? '<th>Date</th><th>Sets</th><th>Max Weight</th><th>Max Reps</th><th>Volume</th>'
      : exType === 'sprint'
      ? '<th>Date</th><th>Reps</th><th>Best Time</th>'
      : '<th>Date</th><th>Sets</th><th>Best</th>';

    const tbodyRows = recent.map(sess => {
      if (exType === 'strength') {
        const ws = sess.sets.map(s => parseFloat(s.vals?.weight) || 0).filter(v => v > 0);
        const rs = sess.sets.map(s => parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0).filter(v => v > 0);
        let vol = 0;
        sess.sets.forEach(s => {
          vol += (parseFloat(s.vals?.weight) || 0) * (parseInt(String(s.vals?.reps || '0').match(/\d+/)?.[0]) || 0);
        });
        const maxW = ws.length ? Math.max(...ws) : null;
        const maxR = rs.length ? Math.max(...rs) : null;
        return `<tr>
          <td style="color:#8bbdd8">${sess.dateStr}</td>
          <td>${sess.sets.length}</td>
          <td style="color:#4a9adc;font-weight:700">${maxW != null ? maxW + ' lb' : '—'}</td>
          <td style="color:#c8dff0">${maxR != null ? maxR : '—'}</td>
          <td style="color:#5adb9a">${vol ? vol.toLocaleString() + ' lb' : '—'}</td>
        </tr>`;
      } else if (exType === 'sprint') {
        const ts = sess.sets.map(s => parseFloat(s.vals?.stime) || 0).filter(v => v > 0);
        return `<tr>
          <td style="color:#8bbdd8">${sess.dateStr}</td>
          <td>${sess.sets.length}</td>
          <td style="color:#e07050;font-weight:700">${ts.length ? Math.min(...ts).toFixed(2) + 's' : '—'}</td>
        </tr>`;
      } else {
        const best = sess.sets[0]?.vals?.dist || sess.sets[0]?.vals?.reps || '—';
        return `<tr>
          <td style="color:#8bbdd8">${sess.dateStr}</td>
          <td>${sess.sets.length}</td>
          <td style="color:#5adb9a;font-weight:700">${best}</td>
        </tr>`;
      }
    }).join('');

    chartsHtml += `
      <div class="prog-chart-card">
        <div class="prog-chart-title">Session History (most recent first)</div>
        <div style="overflow-x:auto">
          <table class="prog-history-table">
            <thead><tr>${theadCols}</tr></thead>
            <tbody>${tbodyRows}</tbody>
          </table>
        </div>
      </div>`;
  }

  return importBar + statsHtml + pickerHtml + chartsHtml + '<div style="height:40px"></div>';
}

// ── Autocomplete ──────────────────────────────────────────────────────────────
let _acActive    = null; // { input, matches }
let _acIdx       = -1;
let _acSuppress  = false;

const EX_TYPE_LABEL = {
  strength: '', bodyweight: 'BW', cardio: 'Cardio',
  sprint: 'Sprint', jumprope: 'Rope', cycling: 'Cycling', power: 'Power',
};

function acShow(input) {
  if (_acSuppress) { _acSuppress = false; return; }
  const val = input.value.trim().toLowerCase();
  if (!val) { acHide(); return; }

  const matches = ALL_EXERCISES
    .filter(ex => ex.name.toLowerCase().includes(val))
    .sort((a, b) => {
      const as = a.name.toLowerCase().startsWith(val) ? 0 : 1;
      const bs = b.name.toLowerCase().startsWith(val) ? 0 : 1;
      return as - bs || a.name.localeCompare(b.name);
    })
    .slice(0, 10);

  if (!matches.length) { acHide(); return; }
  if (matches.length === 1 && matches[0].name.toLowerCase() === val) { acHide(); return; }

  _acActive = { input, matches };
  _acIdx = -1;

  const dd = document.getElementById('ac-dropdown');
  const rect = input.getBoundingClientRect();
  dd.style.left  = rect.left + 'px';
  dd.style.top   = (rect.bottom + 3) + 'px';
  dd.style.width = rect.width + 'px';
  dd.style.display = 'block';

  dd.innerHTML = matches.map((ex, i) => {
    const lo  = ex.name.toLowerCase();
    const idx = lo.indexOf(val);
    const pre  = escHtml(ex.name.slice(0, idx));
    const hit  = escHtml(ex.name.slice(idx, idx + val.length));
    const post = escHtml(ex.name.slice(idx + val.length));
    const badge = EX_TYPE_LABEL[ex.type]
      ? `<span style="font-size:9px;color:#3a7a5a;margin-left:6px;font-weight:700">${EX_TYPE_LABEL[ex.type]}</span>`
      : '';
    return `<div class="ac-item" data-i="${i}"
      onmousedown="acPick(${i})"
      onmouseover="acHover(${i})">${pre}<strong style="color:#7dd8ff">${hit}</strong>${post}${badge}</div>`;
  }).join('');
}

function acHide() {
  const dd = document.getElementById('ac-dropdown');
  if (dd) dd.style.display = 'none';
  _acActive = null;
  _acIdx = -1;
}

function acHover(i) {
  _acIdx = i;
  document.querySelectorAll('.ac-item').forEach((el, j) => {
    el.classList.toggle('ac-hover', j === i);
  });
}

function acPick(i) {
  if (!_acActive) return;
  const input  = _acActive.input;
  const chosen = _acActive.matches[i]; // { name, type }
  _acActive = null; _acIdx = -1;
  document.getElementById('ac-dropdown').style.display = 'none';
  input.value = chosen.name;
  _acSuppress = true;
  input.dispatchEvent(new Event('input', { bubbles: true }));
  // Auto-set the exercise type select in the same row
  if (chosen.type) {
    const typeSel = input.closest('.ex-row')?.querySelector('.presc-type-sel');
    if (typeSel && typeSel.value !== chosen.type) {
      typeSel.value = chosen.type;
      typeSel.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }
  input.focus();
}

function acKey(e, input) {
  if (!_acActive) return;
  const items = document.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _acIdx = Math.min(_acIdx + 1, items.length - 1);
    acHover(_acIdx);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _acIdx = Math.max(_acIdx - 1, 0);
    acHover(_acIdx);
  } else if ((e.key === 'Enter' || e.key === 'Tab') && _acIdx >= 0) {
    e.preventDefault();
    acPick(_acIdx);
  } else if (e.key === 'Escape') {
    acHide();
  }
}

// Close when clicking outside
document.addEventListener('mousedown', e => {
  const dd = document.getElementById('ac-dropdown');
  if (dd && !dd.contains(e.target)) acHide();
});

// ── Prescription cell ─────────────────────────────────────────────────────────
// type values match Workout Tracker: strength | bodyweight | cardio | sprint | jumprope | cycling
const PRESC_PH = {
  strength:   '5, 8-12',
  max:        '1, 3, 5',
  bodyweight: '10, AMRAP',
  cardio:     '30 min, 5 mi',
  sprint:     '8 × 100m',
  jumprope:   '500, 5 min',
  cycling:    '10 mi, 45 min',
  power:      '5, 3 attempts',
};

function prescCellHtml(ex, dayIdx, ctId) {
  const t   = ex.type || 'strength';
  const ph  = PRESC_PH[t] || '—';
  const onchange = ctId
    ? `updateExType(${dayIdx},'${ex.id}',this.value,'${ctId}')`
    : `updateExType(${dayIdx},'${ex.id}',this.value,null)`;
  const s = v => t === v ? ' selected' : '';

  // For Max (RM) — number-only input, RM appended automatically
  if (t === 'max') {
    const numVal = escHtml(String(ex.reps || '').replace(/RM$/i, ''));
    const oninput = ctId
      ? `updateCircuitExReps(${dayIdx},'${ctId}','${ex.id}',this.value?this.value+'RM':null)`
      : `updateExReps(${dayIdx},'${ex.id}',this.value?this.value+'RM':null)`;
    return `<div class="presc-cell"><div class="presc-row">
      <select class="presc-type-sel" onchange="${onchange}">
        <option value="strength"${s('strength')}>Strength</option>
        <option value="max" selected>Max</option>
        <option value="bodyweight"${s('bodyweight')}>BW</option>
        <option value="cardio"${s('cardio')}>Cardio</option>
        <option value="sprint"${s('sprint')}>Sprint</option>
        <option value="jumprope"${s('jumprope')}>Rope</option>
        <option value="cycling"${s('cycling')}>Cycling</option>
      <option value="power"${s('power')}>Power</option>
      </select>
      <input type="number" min="1" max="20" class="presc-val" value="${numVal}"
        placeholder="${ph}" oninput="${oninput}" style="width:62px;flex:none" />
      <span class="rm-suffix">RM</span>
    </div></div>`;
  }

  const oninput = ctId
    ? `updateCircuitExReps(${dayIdx},'${ctId}','${ex.id}',this.value)`
    : `updateExReps(${dayIdx},'${ex.id}',this.value)`;
  return `<div class="presc-cell"><div class="presc-row">
    <select class="presc-type-sel" onchange="${onchange}">
      <option value="strength"${s('strength')}>Strength</option>
      <option value="max"${s('max')}>Max</option>
      <option value="bodyweight"${s('bodyweight')}>BW</option>
      <option value="cardio"${s('cardio')}>Cardio</option>
      <option value="sprint"${s('sprint')}>Sprint</option>
      <option value="jumprope"${s('jumprope')}>Rope</option>
      <option value="cycling"${s('cycling')}>Cycling</option>
      <option value="power"${s('power')}>Power</option>
    </select>
    <input type="text" class="presc-val" value="${ex.reps === null ? '' : escHtml(String(ex.reps))}"
      placeholder="${ph}" oninput="${oninput}" />
  </div></div>`;
}

function updateExType(dayIdx, exId, val, ctId) {
  const week = getOrCreateWeekProgram();
  if (ctId) {
    const ct = (week[dayIdx].circuits || []).find(c => c.id === ctId);
    const ex = ct && ct.exercises.find(e => e.id === exId);
    if (ex) { ex.type = val; ex.reps = null; }
  } else {
    const ex = (week[dayIdx].exercises || []).find(e => e.id === exId);
    if (ex) { ex.type = val; ex.reps = null; }
  }
  save(state); renderMain();
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderSidebar() {
  const list = document.getElementById('clientList');
  if (!state.clients.length) {
    list.innerHTML = '<div style="padding:14px;font-size:12px;color:#2d4a6a;text-align:center;">No clients yet</div>';
    return;
  }
  list.innerHTML = state.clients.map(c => `
    <div class="client-item ${c.id === activeClientId ? 'active' : ''}" onclick="selectClient('${c.id}')">
      <span>${escHtml(c.name)}</span>

        <button class="del-btn" onclick="event.stopPropagation();deleteClient('${c.id}')" title="Delete">✕</button>

}
